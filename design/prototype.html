<title>Dukaan POS Prototype</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500&family=Noto+Naskh+Arabic:wght@400;500;600&display=swap">
<style>
/* Premium family: Quiet Tech. Cool graphite neutrals, one emerald accent, hairline rings, layered shadows.
   Layout: phone prototype centered with a screen navigator rail; admin panel opens as a wide desktop frame. */
:root{
  --stage:#ECEDEB; --bg:#F7F7F5; --surface:#FFFFFF; --surface-2:#F0F0EE; --shell:#EEEEEB;
  --fg:#141515; --fg-2:#5B5E62; --fg-3:#8B8E92;
  --line:rgba(20,21,21,.08); --line-2:rgba(20,21,21,.14); --hi:rgba(255,255,255,.9);
  --accent:#0E6B57; --accent-fg:#FFFFFF; --accent-soft:#E2F0EB; --accent-ink:#0A5444;
  --red-bg:#FDEBEC; --red-fg:#9F2F2D; --blue-bg:#E1F3FE; --blue-fg:#1F6C9F;
  --grn-bg:#EDF3EC; --grn-fg:#346538; --yel-bg:#FBF3DB; --yel-fg:#956400;
  --bezel:#17181A; --glass:rgba(247,247,245,.82);
  --sh:0 1px 2px -1px rgb(16 18 20/.06),0 8px 24px -10px rgb(16 18 20/.10),0 24px 64px -28px rgb(16 18 20/.14);
  --ease:cubic-bezier(.16,1,.3,1); --r:16px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --stage:#050606; --bg:#0D0E0E; --surface:#151616; --surface-2:#1C1D1D; --shell:#101111;
  --fg:#EDEEEC; --fg-2:#A1A4A7; --fg-3:#73767A;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15); --hi:rgba(255,255,255,.07);
  --accent:#4CC3A3; --accent-fg:#052018; --accent-soft:#12302A; --accent-ink:#7FDCC2;
  --red-bg:#341A1B; --red-fg:#F0928F; --blue-bg:#132A38; --blue-fg:#7CC1EE;
  --grn-bg:#18281A; --grn-fg:#8FCB93; --yel-bg:#33290F; --yel-fg:#E5B65A;
  --glass:rgba(13,14,14,.82);
  --sh:0 1px 2px -1px rgb(0 0 0/.5),0 8px 24px -10px rgb(0 0 0/.6),0 24px 64px -28px rgb(0 0 0/.7);
  color-scheme:dark}}
:root[data-theme="dark"]{
  --stage:#050606; --bg:#0D0E0E; --surface:#151616; --surface-2:#1C1D1D; --shell:#101111;
  --fg:#EDEEEC; --fg-2:#A1A4A7; --fg-3:#73767A;
  --line:rgba(255,255,255,.08); --line-2:rgba(255,255,255,.15); --hi:rgba(255,255,255,.07);
  --accent:#4CC3A3; --accent-fg:#052018; --accent-soft:#12302A; --accent-ink:#7FDCC2;
  --red-bg:#341A1B; --red-fg:#F0928F; --blue-bg:#132A38; --blue-fg:#7CC1EE;
  --grn-bg:#18281A; --grn-fg:#8FCB93; --yel-bg:#33290F; --yel-fg:#E5B65A;
  --glass:rgba(13,14,14,.82);
  --sh:0 1px 2px -1px rgb(0 0 0/.5),0 8px 24px -10px rgb(0 0 0/.6),0 24px 64px -28px rgb(0 0 0/.7);
  color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--stage);color:var(--fg);font:14px/1.5 'Geist',system-ui,-apple-system,'Segoe UI',sans-serif;
  padding-block:20px 48px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  -webkit-font-smoothing:antialiased}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer;text-align:inherit}
input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ic{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;flex:none}
.ic.s{width:18px;height:18px}.ic.l{width:26px;height:26px}
[dir=rtl] .flip{transform:scaleX(-1)}
.mono{font-family:'Geist Mono',ui-monospace,monospace}.num{font-variant-numeric:tabular-nums}

/* page chrome */
.page{max-width:1180px;margin:0 auto}
.bar{display:flex;flex-wrap:wrap;gap:16px;align-items:center;justify-content:space-between;margin-bottom:24px}
.brand{display:flex;align-items:center;gap:12px}
.mark{width:36px;height:36px;border-radius:11px;background:var(--fg);color:var(--bg);display:grid;place-items:center;font-weight:700;font-size:18px;letter-spacing:-.04em}
.brand b{font-size:16px;letter-spacing:-.02em;display:block;line-height:1.2}.brand span{color:var(--fg-3);font-size:12.5px}
.seg{display:inline-flex;padding:3px;border-radius:12px;background:var(--surface-2);box-shadow:0 0 0 1px var(--line)}
.seg button{height:32px;padding-inline:12px;border-radius:9px;font-size:13px;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;transition:background .2s var(--ease),color .2s}
.seg button.on{background:var(--surface);color:var(--fg);box-shadow:0 0 0 1px var(--line),0 1px 2px rgb(16 18 20/.06)}
.ctrls{display:flex;gap:10px;flex-wrap:wrap}
.layout{display:grid;grid-template-columns:230px minmax(0,1fr);gap:40px;align-items:start}
.rail{position:sticky;top:20px;display:flex;flex-direction:column;gap:4px;max-height:calc(100dvh - 40px);overflow:auto;padding-right:4px}
.rail h6{margin:18px 0 6px;font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.rail h6:first-child{margin-top:0}
.rail button{height:34px;padding-inline:12px;border-radius:10px;color:var(--fg-2);font-size:13.5px;display:flex;align-items:center;transition:background .2s,color .2s}
.rail button:hover{background:var(--surface-2);color:var(--fg)}
.rail button.on{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.stage{display:flex;justify-content:center;min-width:0}
@media (max-width:900px){
  .layout{grid-template-columns:minmax(0,1fr);gap:20px}
  .rail{position:static;flex-direction:row;max-height:none;overflow-x:auto;padding:0 0 6px;gap:6px;scrollbar-width:none}
  .rail h6{display:none}.rail button{flex:none;white-space:nowrap;box-shadow:0 0 0 1px var(--line)}
}

/* phone */
.phone{width:min(390px,100%);height:812px;flex:none;border-radius:50px;padding:9px;background:var(--bezel);box-shadow:var(--sh),0 0 0 1px rgba(255,255,255,.06)}
.dev{position:relative;height:100%;border-radius:41px;overflow:hidden;background:var(--bg);isolation:isolate}
.sb{position:absolute;inset:0 0 auto 0;height:46px;display:flex;align-items:center;justify-content:space-between;padding-inline:30px 28px;z-index:6;background:var(--bg);font:600 13px 'Geist Mono',monospace;direction:ltr}
.island{position:absolute;top:10px;left:50%;width:92px;height:26px;margin-left:-46px;border-radius:20px;background:#000;z-index:7}
.batt{width:24px;height:12px;border-radius:4px;box-shadow:0 0 0 1.4px var(--fg-3);position:relative}.batt::after{content:"";position:absolute;inset:2px 6px 2px 2px;border-radius:2px;background:var(--fg)}
.view{position:absolute;inset:46px 0 0 0;overflow-y:auto;overflow-x:hidden;padding:6px 20px 36px;scrollbar-width:none}
.view::-webkit-scrollbar{display:none}
.view.tabbed{bottom:78px}
.view>*{animation:up .6s var(--ease) both;animation-delay:calc(var(--i,0)*55ms)}
@keyframes up{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.tabs{position:absolute;inset:auto 0 0 0;height:78px;display:grid;grid-template-columns:repeat(5,1fr);align-items:center;background:var(--glass);backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px);border-top:1px solid var(--line);padding-bottom:12px;z-index:5}
.tab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:52px;font-size:11px;color:var(--fg-3);transition:color .2s}
.tab.on{color:var(--accent)}
.tab.sell .fab{width:54px;height:54px;border-radius:19px;background:var(--accent);color:var(--accent-fg);display:grid;place-items:center;margin-top:-22px;box-shadow:0 0 0 5px var(--bg),0 10px 22px -8px var(--accent);transition:transform .2s var(--ease)}
.tab.sell:active .fab{transform:scale(.95)}
.tab.sell{color:var(--fg-2)}
.ur{font-family:'Noto Naskh Arabic','Geist',system-ui,sans-serif;line-height:1.75}
.ur *{letter-spacing:0!important}
.toast{position:absolute;inset:auto 20px 96px;z-index:9;background:var(--fg);color:var(--bg);padding:12px 16px;border-radius:14px;font-size:13.5px;display:flex;gap:10px;align-items:center;animation:up .4s var(--ease) both;box-shadow:var(--sh)}

/* type + atoms */
.t1{font-size:27px;line-height:1.15;letter-spacing:-.03em;font-weight:600;text-wrap:balance}
.t2{font-size:17px;letter-spacing:-.015em;font-weight:600}
.sub{color:var(--fg-2);text-wrap:pretty;max-width:36ch}
.mut{color:var(--fg-2)}.m3{color:var(--fg-3)}.sm{font-size:12.5px}.xs{font-size:11.5px}
.lab{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--fg-3);font-weight:500}
.big{font-size:38px;line-height:1.05;letter-spacing:-.04em;font-weight:600;font-variant-numeric:tabular-nums}
.col{display:flex;flex-direction:column;gap:16px}.gap8{gap:8px}.gap12{gap:12px}
.rowx{display:flex;align-items:center;gap:12px}.sp{justify-content:space-between}.grow{flex:1;min-width:0}.wrap{flex-wrap:wrap}
.card{background:var(--surface);border-radius:var(--r);box-shadow:0 0 0 1px var(--line),0 1px 2px -1px rgb(16 18 20/.05),0 10px 24px -14px rgb(16 18 20/.08)}
.pad{padding:16px}
.shell{padding:6px;border-radius:26px;background:var(--shell);box-shadow:0 0 0 1px var(--line)}
.core{border-radius:20px;background:var(--surface);box-shadow:0 0 0 1px var(--line),inset 0 1px 0 var(--hi);padding:18px}
.hd{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:52px;margin-bottom:6px}
.ib{width:44px;height:44px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;flex:none;position:relative;transition:transform .2s var(--ease)}
.ib:active{transform:scale(.96)}
.dot{position:absolute;top:10px;inset-inline-end:11px;width:8px;height:8px;border-radius:50%;background:var(--red-fg);box-shadow:0 0 0 2px var(--surface)}
.btn{height:52px;border-radius:14px;padding-inline:20px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:8px;transition:transform .2s var(--ease),background .2s,box-shadow .2s;white-space:nowrap}
.btn:active{transform:scale(.98)}
.btn.pri{background:var(--accent);color:var(--accent-fg)}
.btn.sec{background:var(--surface);box-shadow:0 0 0 1px var(--line-2)}
.btn.ghost{color:var(--fg-2);font-weight:500}
.btn.blk{width:100%}.btn.sm{height:40px;border-radius:12px;font-size:13px;padding-inline:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.chip{height:36px;padding-inline:14px;border-radius:999px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:13px;color:var(--fg-2);display:inline-flex;align-items:center;gap:6px;flex:none;transition:background .2s,color .2s}
.chip.on{background:var(--fg);color:var(--bg);box-shadow:none}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;margin-inline:-20px;padding-inline:20px}
.chips::-webkit-scrollbar{display:none}
.badge{display:inline-flex;align-items:center;gap:4px;height:22px;padding-inline:9px;border-radius:999px;font-size:11px;font-weight:500;letter-spacing:.04em;text-transform:uppercase;white-space:nowrap}
.b-red{background:var(--red-bg);color:var(--red-fg)}.b-blue{background:var(--blue-bg);color:var(--blue-fg)}.b-grn{background:var(--grn-bg);color:var(--grn-fg)}.b-yel{background:var(--yel-bg);color:var(--yel-fg)}.b-acc{background:var(--accent-soft);color:var(--accent-ink)}
.av{width:42px;height:42px;border-radius:13px;display:grid;place-items:center;font-weight:600;font-size:14px;flex:none}
.li{display:flex;align-items:center;gap:12px;padding-block:13px;border-bottom:1px solid var(--line);min-height:62px;width:100%}
.li:last-child{border-bottom:0}
.field{display:flex;flex-direction:column;gap:7px}
.field label{font-size:12.5px;color:var(--fg-2);font-weight:500}
.inp{height:52px;border-radius:13px;background:var(--surface);box-shadow:0 0 0 1px var(--line-2);padding-inline:14px;border:0;width:100%;transition:box-shadow .2s}
.inp:focus{outline:0;box-shadow:0 0 0 2px var(--accent)}
.inwrap{display:flex;align-items:center;gap:10px;height:52px;border-radius:13px;background:var(--surface);box-shadow:0 0 0 1px var(--line-2);padding-inline:14px}
.inwrap input{border:0;background:none;flex:1;min-width:0;height:100%}.inwrap input:focus{outline:0}
.inwrap:focus-within{box-shadow:0 0 0 2px var(--accent)}
.sw{width:46px;height:28px;border-radius:99px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line-2);position:relative;flex:none;transition:background .25s}
.sw::after{content:"";position:absolute;top:3px;inset-inline-start:3px;width:22px;height:22px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgb(0 0 0/.25);transition:transform .25s var(--ease)}
.sw.on{background:var(--accent)}.sw.on::after{transform:translateX(18px)}[dir=rtl] .sw.on::after{transform:translateX(-18px)}
.prog{display:flex;gap:5px;margin-bottom:18px}.prog i{flex:1;height:4px;border-radius:4px;background:var(--line-2)}.prog i.on{background:var(--accent)}
.hr{height:1px;background:var(--line);border:0;margin:0}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.grid3{display:grid;grid-template-columns:repeat(3,1fr)}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.tile{background:var(--surface);border-radius:16px;box-shadow:0 0 0 1px var(--line);padding:16px 14px;display:flex;flex-direction:column;gap:12px;align-items:flex-start;min-height:104px;position:relative;transition:box-shadow .2s,transform .2s var(--ease)}
.tile:active{transform:scale(.98)}
.tile.on{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}
.tile .tk{position:absolute;top:10px;inset-inline-end:10px;width:20px;height:20px;border-radius:50%;background:var(--accent);color:var(--accent-fg);display:none;place-items:center}
.tile.on .tk{display:grid}
.tile .ti{width:40px;height:40px;border-radius:12px;background:var(--surface-2);display:grid;place-items:center}
.tile.on .ti{background:var(--surface);color:var(--accent)}
.qa{display:flex;flex-direction:column;align-items:center;gap:8px;font-size:12px;color:var(--fg-2);text-align:center}
.qa i{width:56px;height:56px;border-radius:18px;background:var(--surface);box-shadow:0 0 0 1px var(--line);display:grid;place-items:center;color:var(--fg);transition:transform .2s var(--ease)}
.qa:active i{transform:scale(.95)}
.stat{padding:14px 12px;display:flex;flex-direction:column;gap:2px}.stat+.stat{border-inline-start:1px solid var(--line)}
.bars{display:flex;align-items:flex-end;gap:7px;height:76px}
.bars i{flex:1;border-radius:6px 6px 3px 3px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line);transition:height .6s var(--ease)}
.bars i.hot{background:var(--accent);box-shadow:none}
.bl{display:flex;gap:7px;margin-top:6px}.bl span{flex:1;text-align:center;font-size:10.5px;color:var(--fg-3)}
.pg{display:flex;flex-direction:column;gap:8px}
.pgm{height:8px;border-radius:8px;background:var(--surface-2);overflow:hidden}.pgm i{display:block;height:100%;border-radius:8px;background:var(--accent)}
.pgm.warn i{background:var(--yel-fg)}.pgm.bad i{background:var(--red-fg)}
.stepper{display:inline-flex;align-items:center;border-radius:12px;background:var(--surface-2);box-shadow:inset 0 0 0 1px var(--line)}
.stepper button{width:38px;height:38px;display:grid;place-items:center}.stepper b{min-width:24px;text-align:center;font-variant-numeric:tabular-nums}
.sticky{position:sticky;bottom:-36px;margin:0 -20px -36px;padding:14px 20px 28px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-top:1px solid var(--line);animation:none!important}
.pp{position:relative;width:236px;margin-inline:auto;background:#FCFCFA;color:#1a1a1a;font:12px/1.5 'Geist Mono',monospace;padding:18px 14px 26px;box-shadow:0 1px 2px rgb(0 0 0/.08),0 14px 30px -14px rgb(0 0 0/.25);clip-path:polygon(0 0,100% 0,100% calc(100% - 7px),95% 100%,90% calc(100% - 7px),85% 100%,80% calc(100% - 7px),75% 100%,70% calc(100% - 7px),65% 100%,60% calc(100% - 7px),55% 100%,50% calc(100% - 7px),45% 100%,40% calc(100% - 7px),35% 100%,30% calc(100% - 7px),25% 100%,20% calc(100% - 7px),15% 100%,10% calc(100% - 7px),5% 100%,0 calc(100% - 7px));direction:ltr;text-align:left}
.pp .c{text-align:center}.pp .d{border-top:1px dashed #999;margin:8px 0}.pp .r{display:flex;justify-content:space-between;gap:8px}.pp b{font-weight:600}
.cam{position:relative;height:440px;border-radius:24px;background:#0A0B0B;overflow:hidden;margin-bottom:16px;box-shadow:0 0 0 1px var(--line)}
.cam .fr{position:absolute;inset:92px 44px;}
.cam .fr i{position:absolute;width:34px;height:34px;border:3px solid #fff;border-radius:6px}
.cam .fr i:nth-child(1){top:0;left:0;border-right:0;border-bottom:0}.cam .fr i:nth-child(2){top:0;right:0;border-left:0;border-bottom:0}
.cam .fr i:nth-child(3){bottom:0;left:0;border-right:0;border-top:0}.cam .fr i:nth-child(4){bottom:0;right:0;border-left:0;border-top:0}
.cam .ln{position:absolute;left:12px;right:12px;height:2px;background:#4CC3A3;box-shadow:0 0 14px 2px rgba(76,195,163,.55);animation:scan 2.4s var(--ease) infinite alternate}
@keyframes scan{from{top:8px}to{top:calc(100% - 10px)}}
.cam .hint{position:absolute;inset:auto 0 22px;text-align:center;color:#d8dad9;font-size:13px}
.pay{display:flex;flex-direction:column;gap:8px;align-items:flex-start;padding:14px;border-radius:16px;background:var(--surface);box-shadow:0 0 0 1px var(--line);min-height:84px;transition:box-shadow .2s,background .2s}
.pay.on{box-shadow:0 0 0 2px var(--accent);background:var(--accent-soft)}

/* admin */
.adm{width:100%;max-width:880px;background:var(--surface);border-radius:20px;box-shadow:var(--sh),0 0 0 1px var(--line);display:grid;grid-template-columns:196px minmax(0,1fr);min-height:700px;overflow:hidden}
.adm aside{background:var(--shell);padding:20px 12px;border-inline-end:1px solid var(--line);display:flex;flex-direction:column;gap:4px}
.adm aside button{height:38px;padding-inline:12px;border-radius:10px;color:var(--fg-2);display:flex;align-items:center;gap:10px;font-size:13.5px}
.adm aside button.on{background:var(--surface);color:var(--fg);font-weight:500;box-shadow:0 0 0 1px var(--line)}
.adm main{padding:26px 28px;min-width:0;display:flex;flex-direction:column;gap:22px}
.adm table{width:100%;border-collapse:collapse;font-size:13px}
.adm th{text-align:start;font-weight:500;font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--fg-3);padding:10px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.adm td{padding:13px 12px;border-bottom:1px solid var(--line);white-space:nowrap}
.note{display:flex;gap:10px;align-items:center;padding:12px 14px;border-radius:12px;background:var(--accent-soft);color:var(--accent-ink);font-size:13px;animation:up .4s var(--ease) both}
.kp{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.kp button{height:54px;border-radius:14px;background:var(--surface);box-shadow:0 0 0 1px var(--line);font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;display:grid;place-items:center;transition:transform .15s var(--ease),background .15s}
.kp button:active{transform:scale(.96);background:var(--surface-2)}
.ckb{width:26px;height:26px;border-radius:8px;box-shadow:0 0 0 1.5px var(--line-2);display:grid;place-items:center;flex:none;color:var(--accent-fg)}
.ckb.on{background:var(--accent);box-shadow:none}
.wa{background:var(--surface-2);border-radius:18px;padding:14px;box-shadow:inset 0 0 0 1px var(--line)}
.bub{background:var(--accent-soft);color:var(--fg);border-radius:14px 14px 4px 14px;padding:12px 14px;margin-inline-start:auto;max-width:94%;line-height:1.6}
.doc{background:#fff;color:#1a1a1a;border-radius:8px;padding:18px;font-size:13px;box-shadow:var(--sh);direction:ltr;text-align:left}
.st{width:100%;border-collapse:collapse;font-size:12px}.st th{text-align:left;color:#777;font-weight:500;padding:6px 0;border-bottom:1px solid #ddd}.st td{padding:7px 0;border-bottom:1px solid #eee}
.view.na>*{animation:none}
.sheet{position:sticky;bottom:-36px;margin:18px -20px -36px;padding:10px 20px 30px;background:var(--surface);border-radius:26px 26px 0 0;box-shadow:0 -1px 0 var(--line),0 -18px 40px -18px rgb(16 18 20/.25);display:flex;flex-direction:column;gap:12px;animation:none!important}
